<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Vehicle Ad - easyrides.lk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bubbles"></div>

  <nav class="navbar">
    <div class="logo">
      <span class="rainbow">e</span>
      <span class="rainbow">a</span>
      <span class="rainbow">s</span>
      <span class="rainbow">y</span>
      <span class="rainbow">r</span>
      <span class="rainbow">i</span>
      <span class="rainbow">d</span>
      <span class="rainbow">e</span>
      <span class="rainbow">s</span>
      <span class="rainbow">.</span>
      <span class="rainbow">l</span>
      <span class="rainbow">k</span>
    </div>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="ad_post.html">Post Ad</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    <h1>Post Your Vehicle Ad</h1>
    <form id="vehicleAdForm">
      <label>Vehicle Name:</label>
      <input type="text" name="name" placeholder="Enter vehicle name" required>

      <label>Type:</label>
      <select name="type" required>
        <option value="">Select type</option>
        <option value="Car">Car</option>
        <option value="Van">Van</option>
        <option value="Motorbike">Motorbike</option>
        <option value="Jeep">Jeep</option>
        <option value="Truck/Lorry">Truck/Lorry</option>
        <option value="Tuk Tuk">Tuk Tuk</option>
      </select>

      <label>Price per day (LKR):</label>
      <input type="number" name="price" placeholder="Enter price per day" required>

      <label>Phone Number:</label>
      <input type="tel" name="phone" placeholder="Enter your phone number" required>

      <label>Description:</label>
      <textarea name="description" placeholder="Enter vehicle description" required></textarea>

      <button type="submit">Submit Post Ad</button>
    </form>
  </div>

  <footer>
    <p>© 2023-2025 | easyrides.lk</p>
  </footer>

  <script>
    document.getElementById('vehicleAdForm').addEventListener('submit', function(e){
      e.preventDefault();
      const form = e.target;
      const name = form.name.value;
      const type = form.type.value;
      const price = form.price.value;
      const phone = form.phone.value;
      const description = form.description.value;

      const message = `New Vehicle Ad:
Name: ${name}
Type: ${type}
Price per day: ${price}
Phone: ${phone}
Description: ${description}`;

      const encodedMessage = encodeURIComponent(message);
      const whatsappNumber = '+94779403482';
      const whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;
      window.open(whatsappURL,'_blank');
    });
  </script>
</body>
</html>
